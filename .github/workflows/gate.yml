# gate.yml — the test gate for every push to main and every pull request.
#
# Four independent jobs: java-gate (Gradle + javadoc), web-gate (the
# spectro-web gate script), desktop-gate (the node:test runner of the desktop
# shell) and spectrolyzr-gate (renders and builds every archetype of the
# project generator). Each one extracts its REAL test count and fails on zero,
# because on this tree a green tick alone is worthless — see the comments on
# the run steps.

name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One gate per ref. Pull requests cancel their own superseded runs. Pushes to
# main never cancel a run in progress — but GitHub keeps at most one QUEUED
# run per group, so under rapid successive pushes an intermediate commit can
# lose its queued gate. The newest commit always gets a full one.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # setup-gradle caches ~/.gradle (downloaded dependencies and the wrapper
      # distribution). That is DEPENDENCY caching, not the Gradle BUILD cache —
      # the gate below disables the build cache explicitly, so cached artifacts
      # can never stand in for executed tests.
      - uses: gradle/actions/setup-gradle@v4

      # The PTY tests probe for the compiled helper and self-skip when it is
      # absent. Build it first so those tests actually run instead of silently
      # skipping. Plain cc; openpty needs no extra linking on current glibc.
      - name: Build the PTY helper
        run: ./scripts/build-spectro-pty.sh

      # --rerun-tasks --no-build-cache is NOT optional. On a warm tree a plain
      # `./gradlew test` reports BUILD SUCCESSFUL in half a second having
      # executed zero tests (up-to-date checks skip the whole task, and even
      # `cleanTest test` comes back FROM-CACHE). These flags force every test
      # to execute on every run. The javadoc legs are here because javadoc
      # otherwise only runs at release, which is the one place a broken doc
      # comment is expensive to discover. ALL FIVE modules, not the two that
      # publish: an orphaned @param in spectro-server slipped past this gate
      # for a day because only core and orchestrator were checked, and the
      # commit that fixed it credited a coverage this gate did not have.
      - name: Java gate
        run: >
          ./gradlew test --rerun-tasks --no-build-cache
          :spectro-core:javadoc :spectro-orchestrator:javadoc
          :spectro-server:javadoc :spectro-cli:javadoc :spectro-mcp-notes:javadoc

      # A green Gradle run is only trusted together with a non-zero test count.
      # Sum the tests/failures/errors/skipped attributes over every JUnit XML
      # result file, publish the totals to the job summary, and fail if the
      # gate executed zero tests.
      - name: Enforce a non-zero JUnit test count
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("*/build/test-results/test/*.xml"))
          tests = failures = errors = skipped = 0
          for path in files:
              attrs = ET.parse(path).getroot().attrib
              tests += int(attrs.get("tests", 0))
              failures += int(attrs.get("failures", 0))
              errors += int(attrs.get("errors", 0))
              skipped += int(attrs.get("skipped", 0))

          line = (
              f"JUnit: {tests} tests, {failures} failures, {errors} errors, "
              f"{skipped} skipped ({len(files)} result files)"
          )
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### java gate\n\n{line}\n")

          if tests == 0:
              print("::error::The Java gate executed zero tests. On this tree "
                    "a green build without a test count means the suite was "
                    "skipped, not that it passed.")
              sys.exit(1)
          PY

  web-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Dependency caching only (the npm cache directory), keyed on the
      # lockfile — no build outputs are cached.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spectro-web/package-lock.json

      - name: Install dependencies
        working-directory: spectro-web
        run: npm ci

      # The gate is tsc -b && eslint . && prettier --check . && vitest run &&
      # vite build. The final `vite build` writes the bundle into
      # spectro-server/src/main/resources/static — TRACKED files — so this
      # step leaves the tree dirty by design. The CI checkout is a throwaway,
      # so that is fine here; do not add a "git status must be clean" check
      # after this step, it would fail on the gate's own output.
      #
      # Note for anyone reading this while resolving a merge: the bundle is
      # also why two branches that touch spectro-web always conflict, and the
      # conflict is ten files, not one. docs/WEB-BUNDLE.md explains it and
      # names the one command that resolves it correctly (card 188).
      #
      # The gate's output is captured so the next step can read the vitest
      # summary; pipefail keeps the tee pipe from masking a failing gate.
      - name: Web gate
        working-directory: spectro-web
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee "$RUNNER_TEMP/web-gate.log"

      # A green gate is only trusted together with a non-zero test count.
      # vitest prints a fixed-format summary line on pass, e.g.
      #   "      Tests  1820 passed (1820)"
      # (harmless Node warnings interleave with it, so the log is grepped
      # rather than tailed). On a runner that line arrives COLORED: the CI
      # env var alone makes vitest emit ANSI codes even into a piped log, and
      # the escapes land between "Tests" and the digits — strip them first or
      # the grep never matches. The count is a reported measurement; the
      # pass/fail authority stays with the gate's exit status above. Publish
      # the count and fail if it is missing or zero.
      - name: Enforce a non-zero vitest test count
        if: always()
        run: |
          log="$RUNNER_TEMP/web-gate.log"
          line="$(sed $'s/\x1b\\[[0-9;]*m//g' "$log" 2>/dev/null | grep -E '^[[:space:]]*Tests[[:space:]]+[0-9]+ passed' | tail -n 1 || true)"
          count="$(printf '%s\n' "$line" | grep -oE '[0-9]+' | head -n 1 || true)"
          {
            echo "### web gate"
            echo ""
            echo "vitest: ${count:-0} tests passed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${count:-}" ] || [ "$count" -eq 0 ]; then
            echo "::error::The web gate reported zero vitest tests — the summary line was missing or counted 0. The tick alone proves nothing."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The desktop shell had no test runner and no job here at all, which card 200
  # section 7 named as the reason its engine assumptions could drift unseen.
  # Card 201 stood the runner up (node:test, zero new dependencies) and this is
  # the job that runs it.
  #
  # What runs here is the PURE half — the net fence the browser's own request
  # hook enforces, the filter list, and the pane geometry — plus a typecheck.
  # The Electron half (test/engineGuard.js) needs a display and a real GPU-less
  # Chromium; it is run by hand with `npm run guard` and is the drift guard the
  # engine document asks for. Wiring it into CI is its own piece of work, and
  # claiming it runs here when it does not would be worse than saying so.
  desktop-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spectro-desktop/package-lock.json

      # ELECTRON_SKIP_BINARY_DOWNLOAD: the tests in this job import no electron
      # module — they are pure functions — so the 100+ MB binary is a download
      # this job does not need.
      - name: Install dependencies
        working-directory: spectro-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Desktop gate
        working-directory: spectro-desktop
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee "$RUNNER_TEMP/desktop-gate.log"

      # Same rule as the other two gates: a tick without a count proves nothing.
      # node:test prints "# pass 14" at the end of its TAP summary.
      - name: Enforce a non-zero node:test count
        if: always()
        run: |
          log="$RUNNER_TEMP/desktop-gate.log"
          count="$(grep -oE '^# pass [0-9]+' "$log" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' || true)"
          {
            echo "### desktop gate"
            echo ""
            echo "node:test: ${count:-0} tests passed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${count:-}" ] || [ "$count" -eq 0 ]; then
            echo "::error::The desktop gate reported zero tests — the summary line was missing or counted 0."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Card 484: the Spectrolyzr generates a project and the claim is that the
  # project builds green with its own test command. This job is where that
  # claim is checked: for each language it renders every archetype (bare, and
  # with all add-ons), installs, runs the project's own check command and
  # requires a non-zero test count per project. One matrix leg per language so
  # a broken template names its language. fail-fast is off so one red leg does
  # not hide the state of the other two.
  spectrolyzr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, java]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        if: matrix.language == 'python'
        with:
          python-version: "3.12"

      - name: Render the archetypes
        run: ./gradlew :spectro-server:renderArchetypes --rerun-tasks --no-build-cache -PspectrolyzrOut="$RUNNER_TEMP/lyzr" -PspectrolyzrLanguage=${{ matrix.language }}

      # Writes each project's output to check.log and never through a pipe, so
      # the exit status is the project's own.
      - name: Build and test every rendered project
        run: python3 scripts/build_archetypes.py ${{ matrix.language }} "$RUNNER_TEMP/lyzr"

      - name: Enforce a non-zero test count per project
        if: always()
        run: python3 scripts/count_archetype_tests.py ${{ matrix.language }} "$RUNNER_TEMP/lyzr"
