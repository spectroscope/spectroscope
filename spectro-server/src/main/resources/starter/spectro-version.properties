# Stamped by the build: processResources (spectro-server/build.gradle.kts)
# expands the Gradle module version into the line below. StarterBundles reads
# it at class-init and fails loudly if the placeholder survives — a starter
# bundle naming a stale-but-resolving Maven version is worse than a crash.
# Never write a version here by hand; that is the bug this file kills (card 143).
# The line after the version is the build label of a test build (card 398):
# "label=<label>" when the build was given -Pspectro.buildLabel, empty otherwise.
version=${version}
${labelLine}
