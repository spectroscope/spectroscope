# One task = one container = one image. No agent, no label, no node.
platform: linux

image_resource:
  type: registry-image
  source:
    # The SAME JDK the GitHub gate pins. This machine's only host JDK is 25, so
    # a gate run on the host is not the gate CI runs — inside here it is.
    repository: eclipse-temurin
    tag: 21-jdk

inputs:
  - name: repo

# The caches Concourse will keep between runs of this task. Without them every
# run downloads the whole Gradle distribution and measures the network.
caches:
  - path: repo/.gradle
  - path: gradle-home

run:
  path: bash
  args:
    - -c
    - |
      set -eu
      cd repo
      export GRADLE_USER_HOME="$PWD/../gradle-home"
      export GRADLE_OPTS="-Dorg.gradle.daemon=false"
      java -version
      # --rerun-tasks --no-build-cache, always. A plain `./gradlew test` on this
      # tree goes green in half a second having run nothing.
      ./gradlew test --rerun-tasks --no-build-cache
      # The count, read from the XML rather than from "BUILD SUCCESSFUL" — in
      # awk, not python: eclipse-temurin carries a JDK and nothing else, and the
      # first triggered build died at exit 127 right here proving it. The four
      # numbers live as attributes on each file's <testsuite> root, so one
      # match() per attribute is the whole parse.
      awk '
        /<testsuite / && !seen[FILENAME]++ {
          t += attr($0, "tests")
          f += attr($0, "failures") + attr($0, "errors")
          s += attr($0, "skipped")
        }
        function attr(line, name,    m) {
          m = match(line, name "=\"[0-9]+\"")
          if (!m) return 0
          return substr(line, RSTART + length(name) + 2, RLENGTH - length(name) - 3) + 0
        }
        END { printf "JUnit %d, failures %d, skipped %d\n", t, f, s }
      ' */build/test-results/test/TEST-*.xml
